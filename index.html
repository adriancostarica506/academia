<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Sistema - Academia Elohim</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- API OFICIAL DE CLOUDFLARE TURNSTILE (CON CARGA EXPLÍCITA) -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md border border-slate-200">
    <div class="text-center mb-6">
      <div class="w-20 h-20 mx-auto mb-3 rounded-full bg-white border border-slate-200 p-1 flex items-center justify-center overflow-hidden shadow-sm">
        <img 
          src="logo.png" 
          alt="Academia Elohim" 
          class="w-full h-full object-contain rounded-full"
          onerror="this.onerror=null; this.src='assets/logo.png';"
        >
      </div>
      <h1 class="text-2xl font-black text-slate-800 tracking-tight">Academia Elohim</h1>
      <p class="text-xs text-slate-500 mt-1">Ingreso exclusivo para Personal Docente, Recepción y Administrador</p>
    </div>

    <!-- Mensaje de Alerta -->
    <div id="loginAlert" class="hidden mb-4 p-3 rounded-xl text-xs font-semibold"></div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Usuario o Nombre Completo</label>
        <input 
          type="text" 
          id="userInput" 
          required 
          autocomplete="username"
          placeholder="Ej: Pedro Castro o juan"
          class="w-full border border-slate-300 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-blue-500 font-medium"
        >
      </div>

      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="block text-xs font-bold text-slate-700 uppercase">Contraseña</label>
          <button 
            type="button" 
            onclick="openForgotModal()" 
            class="text-[11px] font-bold text-blue-600 hover:text-blue-800 transition underline cursor-pointer"
          >
            ¿Olvidaste tu contraseña?
          </button>
        </div>
        <input 
          type="password" 
          id="passwordInput" 
          required 
          autocomplete="current-password"
          placeholder="••••••••"
          class="w-full border border-slate-300 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-blue-500"
        >
      </div>

      <!-- WIDGET CLOUDFLARE TURNSTILE (ESPACIO RESERVADO) -->
      <div class="flex justify-center pt-1 min-h-[65px]">
        <div id="turnstile-container"></div>
      </div>

      <button 
        type="submit" 
        id="btnLogin"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition shadow-md text-sm cursor-pointer disabled:opacity-50"
      >
        Iniciar Sesión
      </button>
    </form>
  </div>

  <!-- MODAL: RECUPERAR CONTRASEÑA -->
  <div id="forgotModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-6 space-y-4 border border-slate-100">
      <div class="flex justify-between items-center border-b border-slate-100 pb-2">
        <h3 class="text-sm font-bold text-slate-800">Recuperar Acceso</h3>
        <button onclick="closeForgotModal()" class="text-slate-400 hover:text-slate-600 font-bold text-sm">✕</button>
      </div>

      <p class="text-xs text-slate-600 leading-relaxed">
        Ingresa el correo electrónico asociado a tu cuenta de Administrador o Personal. Te enviaremos un enlace seguro para restablecerla.
      </p>

      <div id="forgotAlert" class="hidden p-2.5 rounded-xl text-xs font-semibold"></div>

      <form id="forgotForm" class="space-y-3">
        <div>
          <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Correo Electrónico</label>
          <input 
            type="email" 
            id="forgotEmail" 
            required 
            placeholder="ejemplo@correo.com"
            class="w-full border border-slate-300 rounded-xl p-2.5 text-xs outline-none focus:ring-2 focus:ring-blue-500"
          >
        </div>

        <div class="flex justify-end gap-2 pt-1">
          <button 
            type="button" 
            onclick="closeForgotModal()" 
            class="px-3.5 py-2 text-xs font-semibold rounded-xl border border-slate-300 text-slate-600 hover:bg-slate-50 transition"
          >
            Cancelar
          </button>
          <button 
            type="submit" 
            id="btnSendReset" 
            class="px-4 py-2 text-xs font-bold rounded-xl bg-blue-600 hover:bg-blue-700 text-white transition shadow-sm"
          >
            Enviar Enlace
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ianektdgzoohzrktuzph.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlhbmVrdGRnem9vaHpya3R1enBoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MzQ1ODEsImV4cCI6MjEwNjIxMDU4MX0.dxV9ZmlFPuNVF5gTx5oURXrtOj1wRoIbLf5A1S99U8c';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let turnstileToken = null;
    let turnstileWidgetId = null;

    // Inicialización del widget de Cloudflare Turnstile
    function initTurnstile() {
      const container = document.getElementById('turnstile-container');
      if (window.turnstile && container) {
        if (turnstileWidgetId === null) {
          turnstileWidgetId = window.turnstile.render('#turnstile-container', {
            sitekey: '0x4AAAAAAFI0QkkSIlviXZVC',
            theme: 'light',
            callback: function(token) {
              turnstileToken = token;
            },
            'expired-callback': function() {
              turnstileToken = null;
            },
            'error-callback': function() {
              turnstileToken = null;
            }
          });
        }
      } else {
        setTimeout(initTurnstile, 150);
      }
    }

    document.addEventListener('DOMContentLoaded', initTurnstile);

    function showAlert(message, type = 'error') {
      const alertBox = document.getElementById('loginAlert');
      alertBox.textContent = message;
      alertBox.className = `mb-4 p-3 rounded-xl text-xs font-semibold ${
        type === 'error' ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'
      }`;
      alertBox.classList.remove('hidden');
    }

    function resetTurnstile() {
      if (window.turnstile && turnstileWidgetId !== null) {
        try {
          window.turnstile.reset(turnstileWidgetId);
          turnstileToken = null;
        } catch (e) {}
      }
    }

    // Modal de Olvido de Contraseña
    function openForgotModal() {
      document.getElementById('forgotAlert').classList.add('hidden');
      document.getElementById('forgotEmail').value = '';
      document.getElementById('forgotModal').classList.remove('hidden');
    }

    function closeForgotModal() {
      document.getElementById('forgotModal').classList.add('hidden');
    }

    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('forgotEmail').value.trim();
      const btn = document.getElementById('btnSendReset');
      const alertBox = document.getElementById('forgotAlert');

      btn.disabled = true;
      btn.textContent = 'Enviando...';
      alertBox.classList.add('hidden');

      try {
        const options = {
          redirectTo: 'https://academia.elohimcr.workers.dev/reset_password.html'
        };

        if (turnstileToken) {
          options.captchaToken = turnstileToken;
        }

        const { error } = await supabaseClient.auth.resetPasswordForEmail(email, options);

        if (error) throw error;

        alertBox.className = 'p-2.5 rounded-xl text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200';
        alertBox.textContent = '✓ Correo enviado con éxito. Revisa tu bandeja de entrada o spam para restablecerla.';
        alertBox.classList.remove('hidden');

        setTimeout(() => {
          closeForgotModal();
        }, 4000);

      } catch (err) {
        alertBox.className = 'p-2.5 rounded-xl text-xs font-semibold bg-red-50 text-red-700 border border-red-200';
        alertBox.textContent = err.message || 'Error al enviar correo de recuperación.';
        alertBox.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Enviar Enlace';
      }
    });

    // Formulario de Inicio de Sesión
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      document.getElementById('loginAlert').classList.add('hidden');

      const userInput = document.getElementById('userInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      const btnLogin = document.getElementById('btnLogin');

      if (!turnstileToken) {
        const hiddenInput = document.querySelector('[name="cf-turnstile-response"]');
        if (hiddenInput && hiddenInput.value) {
          turnstileToken = hiddenInput.value;
        }
      }

      if (!turnstileToken) {
        showAlert('Por favor espera a que se complete la verificación de seguridad de Cloudflare.');
        return;
      }

      btnLogin.disabled = true;
      btnLogin.textContent = 'Verificando credenciales...';

      try {
        let authEmail = userInput;

        if (!userInput.includes('@')) {
          const { data: resolvedEmail, error: rpcError } = await supabaseClient.rpc('get_email_by_identifier', {
            p_identifier: userInput
          });

          if (rpcError || !resolvedEmail) {
            throw new Error('Usuario o nombre no registrado en el sistema.');
          }

          authEmail = resolvedEmail;
        }

        const { data, error: authError } = await supabaseClient.auth.signInWithPassword({
          email: authEmail,
          password: password,
          options: {
            captchaToken: turnstileToken
          }
        });

        if (authError) throw authError;

        btnLogin.textContent = 'Acceso concedido. Redirigiendo...';
        window.location.href = 'dashboard.html';

      } catch (err) {
        resetTurnstile();
        showAlert(err.message === 'Invalid login credentials' ? 'Contraseña incorrecta o usuario no válido.' : err.message);
        btnLogin.disabled = false;
        btnLogin.textContent = 'Iniciar Sesión';
      }
    });

    // Redirigir si ya tiene sesión
    async function checkSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        window.location.href = 'dashboard.html';
      }
    }

    checkSession();
  </script>
</body>
</html>
