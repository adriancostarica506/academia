<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Administración - Elohim</title>
  <!-- Tailwind CSS para el diseño visual -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8 border border-slate-200">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-slate-800">Sistema Escolar Elohim</h1>
      <p class="text-slate-500 text-sm mt-1">Inicia sesión con tu usuario y contraseña</p>
    </div>

    <!-- Mensaje de alerta de error -->
    <div id="errorMessage" class="hidden mb-4 p-3 bg-red-50 text-red-700 text-sm rounded-lg border border-red-200"></div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Nombre de usuario</label>
        <input 
          type="text" 
          id="username" 
          placeholder="Ej: admin, carlos, recepcion" 
          required 
          autocomplete="username"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800"
        >
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          placeholder="••••••••" 
          required 
          autocomplete="current-password"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800"
        >
      </div>

      <button 
        type="submit" 
        id="btnLogin"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition duration-200"
      >
        Ingresar al Sistema
      </button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
