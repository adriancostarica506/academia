<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Sistema - Academi Elohim</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 font-sans text-slate-800">

  <div class="bg-white p-8 rounded-3xl shadow-xl border border-slate-200 w-full max-w-md space-y-6">
    
    <!-- Encabezado con el Logo de la Academia -->
    <div class="text-center space-y-3">
      <div class="flex justify-center">
        <div class="w-24 h-24 rounded-full bg-white border border-slate-100 shadow-sm flex items-center justify-center p-1 overflow-hidden">
          <img 
            src="logo.png" 
            alt="Logo Academia Elohim" 
            class="w-full h-full object-contain rounded-full"
            onerror="this.onerror=null; this.src='assets/logo.png';"
          >
        </div>
      </div>
      <div>
        <h1 class="text-2xl font-black text-slate-900 tracking-tight">Academi Elohim</h1>
        <p class="text-xs text-slate-500 font-medium">Sistema de Gestión Escolar y Administrativa</p>
      </div>
    </div>

    <!-- Alerta de Error -->
    <div id="loginAlert" class="hidden p-3 rounded-xl text-xs font-semibold bg-red-50 text-red-700 border border-red-200"></div>

    <!-- Formulario de Acceso por Usuario y Contraseña -->
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Usuario</label>
        <input 
          type="text" 
          id="loginUser" 
          required 
          autocomplete="username"
          placeholder="Escribe tu usuario (ej: mario)..."
          class="w-full border border-slate-300 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-blue-500 transition"
        >
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Contraseña</label>
        <input 
          type="password" 
          id="loginPassword" 
          required 
          autocomplete="current-password"
          placeholder="••••••••"
          class="w-full border border-slate-300 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-blue-500 transition"
        >
      </div>

      <button 
        type="submit" 
        id="btnLogin" 
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl text-sm transition shadow-md hover:shadow-lg"
      >
        Ingresar al Panel
      </button>
    </form>

    <div class="text-center pt-2 border-t border-slate-100">
      <p class="text-[11px] text-slate-400">Acceso restringido únicamente para personal autorizado.</p>
    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://ianektdgzoohzrktuzph.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlhbmVrdGRnem9vaHpya3R1enBoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MzQ1ODEsImV4cCI6MjEwNjIxMDU4MX0.dxV9ZmlFPuNVF5gTx5oURXrtOj1wRoIbLf5A1S99U8c';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('loginAlert');
      alertBox.classList.add('hidden');

      const userInput = document.getElementById('loginUser').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('btnLogin');

      btn.disabled = true;
      btn.textContent = 'Verificando credenciales...';

      try {
        let authEmail = userInput;

        // Si el usuario no contiene '@', consultar a Supabase el correo real vinculado
        if (!authEmail.includes('@')) {
          const { data: resolvedEmail, error: rpcErr } = await supabaseClient
            .rpc('get_email_by_identifier', { p_identifier: userInput });

          if (!rpcErr && resolvedEmail) {
            authEmail = resolvedEmail;
          } else {
            // Respaldos habituales por si no resolvió por RPC
            authEmail = `${userInput.toLowerCase()}@academi.com`;
          }
        }

        // Intento de inicio de sesión con el email resuelto
        let { data, error } = await supabaseClient.auth.signInWithPassword({
          email: authEmail,
          password: password
        });

        // Si falla por formato de dominio alternativo, probar combinaciones comunes
        if (error && !userInput.includes('@')) {
          const fallbacks = [
            `${userInput.toLowerCase()}@academia.com`,
            `${userInput.toLowerCase()}@elohim.com`,
            `${userInput.toLowerCase()}@gmail.com`
          ];

          for (const fb of fallbacks) {
            if (fb === authEmail) continue;
            const retry = await supabaseClient.auth.signInWithPassword({
              email: fb,
              password: password
            });
            if (!retry.error) {
              error = null;
              break;
            }
          }
        }

        if (error) throw error;

        window.location.href = 'dashboard.html';

      } catch (err) {
        alertBox.textContent = 'Usuario o contraseña incorrectos.';
        alertBox.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Ingresar al Panel';
      }
    });
  </script>
</body>
</html>
