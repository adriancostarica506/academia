<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restablecer Contraseña - Academia Elohim</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md border border-slate-200">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-black text-slate-800">Nueva Contraseña</h1>
      <p class="text-xs text-slate-500 mt-1">Ingresa tu nueva clave de acceso para tu cuenta.</p>
    </div>

    <div id="alertBox" class="hidden mb-4 p-3 rounded-xl text-xs font-semibold"></div>

    <form id="resetForm" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Nueva Contraseña</label>
        <input 
          type="password" 
          id="newPassword" 
          required 
          minlength="6"
          placeholder="Mínimo 6 caracteres"
          class="w-full border border-slate-300 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-blue-500"
        >
      </div>

      <button 
        type="submit" 
        id="btnSubmit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition text-sm cursor-pointer"
      >
        Guardar Contraseña
      </button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = 'https://ianektdgzoohzrktuzph.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlhbmVrdGRnem9vaHpya3R1enBoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MzQ1ODEsImV4cCI6MjEwNjIxMDU4MX0.dxV9ZmlFPuNVF5gTx5oURXrtOj1wRoIbLf5A1S99U8c';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function showAlert(msg, isError = true) {
      const box = document.getElementById('alertBox');
      box.textContent = msg;
      box.className = `mb-4 p-3 rounded-xl text-xs font-semibold ${isError ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'}`;
      box.classList.remove('hidden');
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('newPassword').value;
      const btn = document.getElementById('btnSubmit');

      btn.disabled = true;
      btn.textContent = 'Actualizando...';

      try {
        const { error } = await supabaseClient.auth.updateUser({ password: password });
        if (error) throw error;

        showAlert('¡Contraseña actualizada con éxito! Redirigiendo al inicio...', false);
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 2000);
      } catch (err) {
        showAlert(err.message);
        btn.disabled = false;
        btn.textContent = 'Guardar Contraseña';
      }
    });
  </script>
</body>
</html>
