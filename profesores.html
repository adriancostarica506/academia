<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Profesores - Academi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <!-- Barra Superior -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <a href="dashboard.html" class="text-xl font-bold text-blue-600 hover:text-blue-700">← Volver al Panel</a>
        <span class="text-slate-400">|</span>
        <span class="text-sm font-semibold text-slate-600">Gestión de Profesores</span>
      </div>
      <div>
        <button id="btnLogout" class="text-sm text-red-600 hover:text-red-800 font-medium px-3 py-1.5 rounded-lg border border-red-200 hover:bg-red-50 transition">
          Cerrar Sesión
        </button>
      </div>
    </div>
  </header>

  <!-- Contenido -->
  <main class="max-w-7xl mx-auto px-4 py-6">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

      <!-- Formulario para Crear Profesor -->
      <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm h-fit">
        <h2 class="text-lg font-bold text-slate-800 mb-4">Registrar Nuevo Profesor</h2>

        <div id="alertMsg" class="hidden mb-4 p-3 rounded-lg text-sm"></div>

        <form id="createTeacherForm" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Nombre Completo (solo letras)</label>
            <input 
              type="text" 
              id="teacherName" 
              placeholder="Ej: Carlos Morales" 
              required 
              pattern="^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+$" 
              title="Solo se permiten letras y espacios" 
              class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none"
            >
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Especialidad / Materia</label>
            <select id="teacherSpecialty" required class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white">
              <option value="" disabled selected>Selecciona una especialidad...</option>
              <option value="Barberia y Estilismo">Barbería y Estilismo</option>
              <option value="Manicurismo">Manicurismo</option>
              <option value="Trenzado">Trenzado</option>
              <option value="Maquillaje">Maquillaje</option>
              <option value="Estilismo">Estilismo</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Teléfono</label>
            <input type="tel" id="teacherPhone" placeholder="Ej: 8888-8888" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>

          <div class="border-t border-slate-200 pt-3">
            <label class="block text-xs font-semibold text-slate-600 mb-1">Nombre de Usuario (Login)</label>
            <input 
              type="text" 
              id="teacherUsername" 
              placeholder="Ej: carlos" 
              required 
              pattern="^[a-zA-Z0-9._-]+$"
              title="Solo letras, números, puntos o guiones, sin espacios"
              class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none"
            >
            <span class="text-xs text-slate-400">Obligatorio. Sin espacios.</span>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Contraseña Inicial</label>
            <input 
              type="password" 
              id="teacherPassword" 
              placeholder="••••••••" 
              required 
              minlength="6"
              title="Mínimo 6 caracteres"
              class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none"
            >
            <span class="text-xs text-slate-400">Obligatorio (mínimo 6 caracteres).</span>
          </div>

          <button type="submit" id="btnSubmit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg text-sm transition">
            Crear Profesor
          </button>
        </form>
      </div>

      <!-- Tabla de Profesores Creados -->
      <div class="lg:col-span-2 bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
        <h2 class="text-lg font-bold text-slate-800 mb-4">Profesores Registrados</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse text-sm">
            <thead>
              <tr class="border-b border-slate-200 text-slate-500 text-xs uppercase bg-slate-50">
                <th class="p-3">Nombre</th>
                <th class="p-3">Especialidad</th>
                <th class="p-3">Teléfono</th>
                <th class="p-3">Usuario</th>
              </tr>
            </thead>
            <tbody id="teachersTableBody">
              <tr>
                <td colspan="4" class="p-4 text-center text-slate-400">Cargando profesores...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://ianektdgzoohzrktuzph.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlhbmVrdGRnem9vaHpya3R1enBoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MzQ1ODEsImV4cCI6MjEwNjIxMDU4MX0.dxV9ZmlFPuNVF5gTx5oURXrtOj1wRoIbLf5A1S99U8c';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const alertMsg = document.getElementById('alertMsg');
    const tableBody = document.getElementById('teachersTableBody');
    const form = document.getElementById('createTeacherForm');
    const btnSubmit = document.getElementById('btnSubmit');

    function showAlert(text, type = 'error') {
      alertMsg.textContent = text;
      alertMsg.className = `mb-4 p-3 rounded-lg text-sm ${type === 'error' ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'}`;
      alertMsg.classList.remove('hidden');
    }

    async function checkAdmin() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        window.location.href = 'index.html';
        return;
      }

      const { data: profile } = await supabaseClient
        .from('profiles')
        .select('role')
        .eq('id', session.user.id)
        .single();

      if (!profile || profile.role !== 'admin') {
        alert('Acceso restringido solo para administradores.');
        window.location.href = 'dashboard.html';
      }
    }

    async function loadTeachers() {
      const { data, error } = await supabaseClient
        .from('teachers')
        .select('full_name, specialty, phone, profiles(username)')
        .order('created_at', { ascending: false });

      if (error) {
        tableBody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-red-500">Error al cargar profesores.</td></tr>`;
        return;
      }

      if (!data || data.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-400">No hay profesores registrados aún.</td></tr>`;
        return;
      }

      tableBody.innerHTML = data.map(t => `
        <tr class="border-b border-slate-100 hover:bg-slate-50">
          <td class="p-3 font-medium text-slate-800">${t.full_name}</td>
          <td class="p-3 text-slate-600"><span class="px-2 py-1 rounded bg-slate-100 text-xs font-semibold">${t.specialty || '-'}</span></td>
          <td class="p-3 text-slate-600">${t.phone || '-'}</td>
          <td class="p-3 font-mono text-xs text-blue-600 bg-blue-50 w-fit rounded px-2 py-0.5">${t.profiles?.username || '-'}</td>
        </tr>
      `).join('');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertMsg.classList.add('hidden');

      const full_name = document.getElementById('teacherName').value.trim();
      const specialty = document.getElementById('teacherSpecialty').value;
      const phone = document.getElementById('teacherPhone').value.trim();
      const username = document.getElementById('teacherUsername').value.trim().toLowerCase();
      const password = document.getElementById('teacherPassword').value;

      // Validación JS extra de solo letras
      const nameRegex = /^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+$/;
      if (!nameRegex.test(full_name)) {
        showAlert('El nombre completo solo puede contener letras y espacios.');
        return;
      }

      if (!username || !password || !specialty) {
        showAlert('Por favor completa todos los campos requeridos.');
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Creando...';

      try {
        const { data, error } = await supabaseClient.rpc('admin_create_teacher', {
          p_full_name: full_name,
          p_username: username,
          p_password: password,
          p_specialty: specialty,
          p_phone: phone
        });

        if (error) throw error;

        showAlert('¡Profesor creado exitosamente!', 'success');
        form.reset();
        loadTeachers();
      } catch (err) {
        showAlert(err.message || 'Error al crear el profesor.');
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'Crear Profesor';
      }
    });

    document.getElementById('btnLogout').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      sessionStorage.clear();
      window.location.href = 'index.html';
    });

    checkAdmin().then(loadTeachers);
  </script>
</body>
</html>
