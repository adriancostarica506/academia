<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bitácora de Actividades - Academi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <!-- Barra Superior -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <a href="dashboard.html" class="text-xl font-bold text-blue-600 hover:text-blue-700">← Volver al Panel</a>
        <span class="text-slate-400">|</span>
        <span class="text-sm font-semibold text-slate-600">Registro de Actividad y Auditoría</span>
      </div>
      <div>
        <button id="btnLogout" class="text-sm text-red-600 hover:text-red-800 font-medium px-3 py-1.5 rounded-lg border border-red-200 hover:bg-red-50 transition">
          Cerrar Sesión
        </button>
      </div>
    </div>
  </header>

  <!-- Contenido -->
  <main class="max-w-7xl mx-auto px-4 py-6">
    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4">
      
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
        <div>
          <h2 class="text-lg font-bold text-slate-800">Historial de Eventos</h2>
          <p class="text-xs text-slate-500">Muestra las acciones realizadas por fecha, hora y usuario.</p>
        </div>
        <button onclick="loadLogs()" class="text-xs bg-blue-50 text-blue-700 hover:bg-blue-100 px-3 py-2 rounded-lg font-medium border border-blue-200">
          Refrescar Bitácora
        </button>
      </div>

      <!-- Filtros -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3 border-y border-slate-100 py-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Filtrar por Usuario / Rol</label>
          <input type="text" id="filterUser" placeholder="Buscar por nombre o rol..." onkeyup="applyFilter()" class="w-full border border-slate-300 rounded-lg p-2 text-xs outline-none focus:ring-1 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Filtrar por Acción</label>
          <input type="text" id="filterAction" placeholder="Ej: Inició sesión, Creó profesor..." onkeyup="applyFilter()" class="w-full border border-slate-300 rounded-lg p-2 text-xs outline-none focus:ring-1 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Fecha</label>
          <input type="date" id="filterDate" onchange="applyFilter()" class="w-full border border-slate-300 rounded-lg p-2 text-xs outline-none focus:ring-1 focus:ring-blue-500">
        </div>
      </div>

      <!-- Tabla de Logs -->
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="border-b border-slate-200 text-slate-500 text-xs uppercase bg-slate-50">
              <th class="p-3">Fecha y Hora</th>
              <th class="p-3">Usuario</th>
              <th class="p-3">Rol</th>
              <th class="p-3">Acción</th>
              <th class="p-3">Detalles</th>
            </tr>
          </thead>
          <tbody id="logsTableBody">
            <tr>
              <td colspan="5" class="p-4 text-center text-slate-400">Cargando registros...</td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://ianektdgzoohzrktuzph.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlhbmVrdGRnem9vaHpya3R1enBoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MzQ1ODEsImV4cCI6MjEwNjIxMDU4MX0.dxV9ZmlFPuNVF5gTx5oURXrtOj1wRoIbLf5A1S99U8c';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allLogs = [];

    async function checkAdmin() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        window.location.href = 'index.html';
        return;
      }
      const { data: profile } = await supabaseClient
        .from('profiles')
        .select('role')
        .eq('id', session.user.id)
        .single();

      if (!profile || profile.role !== 'admin') {
        alert('Acceso exclusivo para administradores.');
        window.location.href = 'dashboard.html';
      }
    }

    async function loadLogs() {
      const tableBody = document.getElementById('logsTableBody');
      const { data, error } = await supabaseClient
        .from('activity_logs')
        .select('*')
        .order('created_at', { ascending: false })
        .limit(200);

      if (error) {
        tableBody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-red-500">Error al cargar bitácora: ${error.message}</td></tr>`;
        return;
      }

      allLogs = data || [];
      renderTable(allLogs);
    }

    function renderTable(logs) {
      const tableBody = document.getElementById('logsTableBody');
      if (logs.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-400">No hay acciones registradas que coincidan.</td></tr>`;
        return;
      }

      tableBody.innerHTML = logs.map(l => {
        const dateObj = new Date(l.created_at);
        const formattedDate = dateObj.toLocaleDateString('es-CR', { day: '2-digit', month: '2-digit', year: 'numeric' });
        const formattedTime = dateObj.toLocaleTimeString('es-CR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

        return `
          <tr class="border-b border-slate-100 hover:bg-slate-50">
            <td class="p-3 font-mono text-xs text-slate-500 whitespace-nowrap">
              ${formattedDate} <span class="text-slate-800 font-semibold">${formattedTime}</span>
            </td>
            <td class="p-3 font-medium text-slate-800">${l.user_name}</td>
            <td class="p-3">
              <span class="px-2 py-0.5 rounded text-xs capitalize font-semibold ${
                l.user_role === 'admin' ? 'bg-purple-100 text-purple-800' :
                l.user_role === 'profesor' ? 'bg-blue-100 text-blue-800' : 'bg-emerald-100 text-emerald-800'
              }">${l.user_role}</span>
            </td>
            <td class="p-3 font-medium text-slate-700">${l.action}</td>
            <td class="p-3 text-xs text-slate-500">${l.details || '-'}</td>
          </tr>
        `;
      }).join('');
    }

    function applyFilter() {
      const userText = document.getElementById('filterUser').value.toLowerCase();
      const actionText = document.getElementById('filterAction').value.toLowerCase();
      const dateVal = document.getElementById('filterDate').value;

      const filtered = allLogs.filter(item => {
        const matchesUser = item.user_name.toLowerCase().includes(userText) || item.user_role.toLowerCase().includes(userText);
        const matchesAction = item.action.toLowerCase().includes(actionText);
        const matchesDate = !dateVal || item.created_at.startsWith(dateVal);
        return matchesUser && matchesAction && matchesDate;
      });

      renderTable(filtered);
    }

    document.getElementById('btnLogout').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      sessionStorage.clear();
      window.location.href = 'index.html';
    });

    checkAdmin().then(loadLogs);
  </script>
</body>
</html>
